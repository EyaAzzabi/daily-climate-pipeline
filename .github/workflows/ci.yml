name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: ruff check src tests scripts

      - name: Test
        # Tests never call the API: they run against a temporary DuckDB file with
        # hand-built rows, so CI does not fail when the upstream source is down.
        run: pytest -q
        env:
          PYTHONPATH: src
