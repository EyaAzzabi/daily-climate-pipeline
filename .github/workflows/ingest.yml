name: Daily ingest

on:
  schedule:
    # 06:15 UTC. Deliberately not on the hour: scheduled runs cluster at :00 on
    # GitHub's shared runners and get queued behind everyone else's.
    - cron: "15 6 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Number of days to backfill"
        default: "1"

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ingest
        env:
          PYTHONPATH: src
        run: python -m pipeline.run --days ${{ github.event.inputs.days || 1 }}

      - name: Rebuild report
        if: success()
        env:
          PYTHONPATH: src
        run: python scripts/make_report.py

      - name: Commit facts and report
        if: success()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/fact_daily_weather.csv reports/
          # No change is a normal outcome when a re-run is idempotent, so an empty
          # diff must not fail the job.
          if git diff --staged --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Daily ingest $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Upload quality report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: quality-report
          path: reports/latest_quality.json
